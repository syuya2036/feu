[package]
name = "feu-core"
version = "0.1.0"
edition = "2021"

[dependencies]
http = "1.0"
bytes = "1.0"
thiserror = "1.0"
feu-router = { path = "../feu-router" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", optional = true }
serde_urlencoded = "0.7.1"
cookie = { version = "0.18.1", optional = true }
futures-util = { version = "0.3.31", optional = true }
http-body-util = "0.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["std", "fmt", "env-filter"] }

[features]
default = []
openapi = []
rpc = []
json = ["dep:serde_json"]
cookie = ["dep:cookie"]
streaming = ["dep:futures-util"]

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
